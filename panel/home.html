<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Flow</title>

    <link href="css/_variables.css" rel="stylesheet" />
    <link href="css/home-indicator.css" rel="stylesheet" />
    <link href="css/prime-tools.css" rel="stylesheet" />
    <link href="css/prime-tools-dialog.css" rel="stylesheet" />
  </head>
  <body class="has-ios-home-indicator">
    <div id="container" class="prime-page">
      <svg class="prime-grain" viewBox="0 0 200 200" preserveAspectRatio="none" aria-hidden="true">
        <filter id="primeNoiseFilter">
          <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#primeNoiseFilter)" />
      </svg>
      <div class="prime-snow" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <main class="prime-shell" aria-label="Prime Tools">
        <div class="prime-content">
        <div class="prime-utility-row">
          <section class="prime-anchor" aria-label="Anchor point positions">
            <div class="prime-anchor__grid" role="group" aria-label="Set layer anchor point">
            <button class="prime-anchor__button" type="button" data-prime-anchor="1" aria-label="Top left anchor" aria-pressed="false">
              <svg class="prime-anchor__icon" viewBox="0 0 15 14" aria-hidden="true">
                <path d="M0.5 0H14.5V2H10V9H2.5V13.5H0.5V7V0Z" fill="currentColor" />
              </svg>
            </button>
            <button class="prime-anchor__button" type="button" data-prime-anchor="2" aria-label="Top center anchor" aria-pressed="false">
              <svg class="prime-anchor__icon" viewBox="0 0 20 10" aria-hidden="true">
                <path d="M20 0V3H14V10H5.5V3H0V0H20Z" fill="currentColor" />
              </svg>
            </button>
            <button class="prime-anchor__button" type="button" data-prime-anchor="3" aria-label="Top right anchor" aria-pressed="false">
              <svg class="prime-anchor__icon" viewBox="0 0 14 14" aria-hidden="true">
                <path d="M13.5 0V14H11.5V9.5H4.5V2H0V0H6.5H13.5Z" fill="currentColor" />
              </svg>
            </button>
            <button class="prime-anchor__button" type="button" data-prime-anchor="4" aria-label="Middle left anchor" aria-pressed="false">
              <svg class="prime-anchor__icon" viewBox="0 0 10 20" aria-hidden="true">
                <path d="M0 0H3V6H10V14.5H3V20H0V0Z" fill="currentColor" />
              </svg>
            </button>
            <button class="prime-anchor__button" type="button" data-prime-anchor="5" aria-label="Center anchor" aria-pressed="false">
              <svg class="prime-anchor__icon" viewBox="0 0 22 22" aria-hidden="true">
                <path d="M0 10H22V12H0V10ZM10 0H12V22H10V0ZM6 6H16V16H6V6Z" fill="currentColor" />
              </svg>
            </button>
            <button class="prime-anchor__button" type="button" data-prime-anchor="6" aria-label="Middle right anchor" aria-pressed="false">
              <svg class="prime-anchor__icon" viewBox="0 0 10 20" aria-hidden="true">
                <path d="M10 20H7V14H0V5.5H7V0H10V20Z" fill="currentColor" />
              </svg>
            </button>
            <button class="prime-anchor__button" type="button" data-prime-anchor="7" aria-label="Bottom left anchor" aria-pressed="false">
              <svg class="prime-anchor__icon" viewBox="0 0 14 15" aria-hidden="true">
                <path d="M0.25 14.75V0.75H2.25V5.25H9.25V12.75H13.75V14.75H7.25H0.25Z" fill="currentColor" />
              </svg>
            </button>
            <button class="prime-anchor__button" type="button" data-prime-anchor="8" aria-label="Bottom center anchor" aria-pressed="false">
              <svg class="prime-anchor__icon" viewBox="0 0 20 10" aria-hidden="true">
                <path d="M0 10V7H6V0H14.5V7H20V10H0Z" fill="currentColor" />
              </svg>
            </button>
            <button class="prime-anchor__button" type="button" data-prime-anchor="9" aria-label="Bottom right anchor" aria-pressed="false">
              <svg class="prime-anchor__icon" viewBox="0 0 14 14" aria-hidden="true">
                <path d="M14 13.5H0V11.5H4.5V4.5H12V0H14V6.5V13.5Z" fill="currentColor" />
              </svg>
            </button>
            </div>
          </section>
          <section class="prime-compose" aria-label="Composition and layer timing tools">
            <div class="prime-compose__buttons">
              <button class="prime-quick-tool" type="button" data-prime-tool="PRE" aria-label="Pre-compose selected layers" title="Pre-compose selected layers">
                <svg class="prime-quick-tool__icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3.5" y="3.5" width="11" height="11" rx="2"></rect>
                  <rect x="9.5" y="9.5" width="11" height="11" rx="2"></rect>
                  <path d="M7 17h5M9.5 14.5V19.5"></path>
                </svg>
                <span class="prime-quick-tool__label">PRE</span>
              </button>
              <button class="prime-quick-tool" type="button" data-prime-tool="UNP" aria-label="Unprecompose selected precompositions" title="Unprecompose selected precompositions">
                <svg class="prime-quick-tool__icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="6.5" y="6.5" width="11" height="11" rx="2"></rect>
                  <path d="M9 3H3v6M15 21h6v-6M3.5 8.5l5-5M20.5 15.5l-5 5"></path>
                </svg>
                <span class="prime-quick-tool__label">UNP</span>
              </button>
            </div>
            <div class="prime-motion-stack">
              <div class="prime-selector-strip" role="group" aria-label="Select shape properties">
                <button class="prime-selector-button" type="button" data-prime-selector="fill" aria-label="Select fill colors" title="Select Fill Color · Alt: Fill and Stroke colors">
                  <svg viewBox="0 0 14 14" aria-hidden="true">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M1 1H13V13H1V1ZM0 14V0H14V14H0ZM12 2H2V12H12V2Z"></path>
                  </svg>
                </button>
                <button class="prime-selector-button" type="button" data-prime-selector="stroke" aria-label="Select stroke properties" title="Select Stroke Color · Alt: Width · Shift: Width and Color">
                  <svg viewBox="0 0 14 14" aria-hidden="true">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M13 1H1V13H13V1ZM0 0V14H14V0H0Z"></path>
                  </svg>
                </button>
                <button class="prime-selector-button" type="button" data-prime-selector="path" aria-label="Select paths" title="Select Shape Paths · Alt: Mask Paths">
                  <svg class="prime-selector-button__path" viewBox="0 0 20 10" aria-hidden="true">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M2.91465 2.49597C2.70873 3.07857 2.15311 3.49597 1.5 3.49597C0.671573 3.49597 0 2.8244 0 1.99597C0 1.16754 0.671573 0.495972 1.5 0.495972C2.15311 0.495972 2.70873 0.913375 2.91465 1.49597H7.43858C6.70324 1.73143 6.00235 2.06762 5.35657 2.49597H2.91465ZM8.5 0.795972C8.5 0.630286 8.63431 0.495972 8.8 0.495972H11.2C11.3657 0.495972 11.5 0.630286 11.5 0.795972V1.63781C13.0957 1.94262 14.5701 2.71854 15.6569 3.83912C17.0342 5.21644 17.8574 7.04428 17.9831 8.97627C18.0018 9.26286 17.7672 9.49597 17.48 9.49597C17.1928 9.49597 16.962 9.26282 16.9406 8.97644C16.8167 7.32053 16.1037 5.75675 14.9215 4.57451C13.9757 3.62878 12.7859 2.98333 11.5 2.69951V3.19597C11.5 3.36166 11.3657 3.49597 11.2 3.49597H8.8C8.63431 3.49597 8.5 3.36166 8.5 3.19597V2.69951C7.21413 2.98333 6.02426 3.62878 5.07854 4.57451C3.89629 5.75675 3.18329 7.32053 3.0594 8.97644C3.03798 9.26283 2.80719 9.49597 2.52 9.49597C2.23281 9.49597 1.99824 9.26286 2.01688 8.97627C2.14258 7.04428 2.96582 5.21644 4.34315 3.83912C5.42991 2.71854 6.90431 1.94262 8.5 1.63781V0.795972ZM18.5 3.49597C19.3284 3.49597 20 2.8244 20 1.99597C20 1.16754 19.3284 0.495972 18.5 0.495972C17.8469 0.495972 17.2913 0.913375 17.0854 1.49597H12.5613C13.2966 1.73143 13.9975 2.06762 14.6433 2.49597H17.0854C17.2913 3.07857 17.8469 3.49597 18.5 3.49597Z"></path>
                  </svg>
                </button>
              </div>
              <div class="prime-sequencer" aria-label="Sequence layers">
                <div class="prime-sequence-controls">
                  <label class="prime-sequence-field" title="Sequence offset in frames">
                    <span>NUM:</span>
                    <input type="number" value="1" step="1" min="1" max="9999" inputmode="numeric" data-prime-sequence-num aria-label="Sequence offset in frames" />
                  </label>
                  <label class="prime-sequence-field" title="Layers per sequence step">
                    <span>STEP:</span>
                    <input type="number" value="1" step="1" min="1" max="999" inputmode="numeric" data-prime-sequence-step aria-label="Layers per sequence step" />
                  </label>
                </div>
                <div class="prime-sequence-orders" role="group" aria-label="Sequence order">
                  <button class="prime-sequence-order" type="button" data-prime-sequence-order="align_order" aria-label="Align layers to playhead" aria-pressed="false" title="Align selected layers to the playhead">
                    <svg viewBox="0 0 26 23" aria-hidden="true">
                      <path d="M5 6H25.74V10.94H5ZM2 6H3V23H2ZM5 12H25.74V16.94H5ZM5 18H25.74V22.94H5ZM6 0L3 4L0 0Z"></path>
                    </svg>
                  </button>
                  <button class="prime-sequence-order" type="button" data-prime-sequence-order="downward_order" aria-label="Sequence downward" aria-pressed="false" title="Sequence downward · Alt: cycle the step pattern">
                    <svg viewBox="0 0 10 8" aria-hidden="true">
                      <path d="M0 0H6.72V1.6H0ZM1 2H7.72V3.6H1ZM2 4H8.72V5.6H2ZM3 6H9.72V7.6H3Z"></path>
                    </svg>
                  </button>
                  <button class="prime-sequence-order" type="button" data-prime-sequence-order="upward_order" aria-label="Sequence upward" aria-pressed="false" title="Sequence upward · Alt: cycle the step pattern">
                    <svg viewBox="0 0 10 8" aria-hidden="true">
                      <path d="M3 0H9.72V1.6H3ZM2 2H8.72V3.6H2ZM1 4H7.72V5.6H1ZM0 6H6.72V7.6H0Z"></path>
                    </svg>
                  </button>
                  <button class="prime-sequence-order" type="button" data-prime-sequence-order="random_order" aria-label="Randomize sequence" aria-pressed="false" title="Randomize timing · Alt: random delay from the first layer">
                    <svg viewBox="0 0 10 8" aria-hidden="true">
                      <path d="M1 0H7.72V1.6H1ZM3 2H9.72V3.6H3ZM0 4H6.72V5.6H0ZM2 6H8.72V7.6H2Z"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </div>
          </section>
        </div>
        <section class="prime-grid" aria-label="Tool shortcuts">
          <button class="prime-tool" type="button" data-prime-tool="FRZ" aria-label="Freeze">
            <img class="prime-tool__icon" src="files/prime-icons/frz.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">FRZ</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="FIT" aria-label="Fit">
            <img class="prime-tool__icon" src="files/prime-icons/fit.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">FIT</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="DSH" aria-label="Dash">
            <img class="prime-tool__icon" src="files/prime-icons/dsh.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">DSH</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="ADJ" aria-label="Adjustment Layer">
            <img class="prime-tool__icon" src="files/prime-icons/adj.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">ADJ</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="MIR" aria-label="Mirror">
            <img class="prime-tool__icon" src="files/prime-icons/mir.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">MIR</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="SOL" aria-label="Solid Layer">
            <img class="prime-tool__icon" src="files/prime-icons/sol.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">SOL</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="SHA" aria-label="Shadow">
            <img class="prime-tool__icon" src="files/prime-icons/sha.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">SHA</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="NUL" aria-label="Null Object">
            <img class="prime-tool__icon" src="files/prime-icons/none.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">NUL</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="CAM" aria-label="Camera">
            <img class="prime-tool__icon" src="files/prime-icons/cam.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">CAM</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="HUE" aria-label="Hue Saturation">
            <img class="prime-tool__icon" src="files/prime-icons/hue.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">HUE</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="FILL" aria-label="Fill">
            <img class="prime-tool__icon" src="files/prime-icons/fill.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">FILL</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="TINT" aria-label="Tint">
            <img class="prime-tool__icon" src="files/prime-icons/tint.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">TINT</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="BLUR" aria-label="Blur">
            <img class="prime-tool__icon" src="files/prime-icons/blur.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">BLUR</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="LUM" aria-label="Lumetri Color">
            <img class="prime-tool__icon" src="files/prime-icons/lum.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">LUM</span>
            <span class="prime-tool__dash"></span>
          </button>
          <button class="prime-tool" type="button" data-prime-tool="CURV" aria-label="Curves">
            <img class="prime-tool__icon" src="files/prime-icons/curv.svg" alt="" aria-hidden="true" />
            <span class="prime-tool__label">CURV</span>
            <span class="prime-tool__dash"></span>
          </button>
        </section>
        </div>
      </main>
    </div>

    <div id="iosHomeIndicator" class="ios-home-indicator" data-target-page="index.html">
      <div class="ios-home-indicator__touch-target" role="button" aria-label="Swipe up" tabindex="0">
        <div class="ios-home-indicator__bar"></div>
      </div>
    </div>
    <script type="text/javascript" src="js/prime-theme.js" charset="utf-8" defer></script>
    <script type="text/javascript" src="js/prime-tools.js" charset="utf-8" defer></script>
    <script type="text/javascript" src="js/home-indicator.js" charset="utf-8" defer></script>
  </body>
</html>

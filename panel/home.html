<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Flow Assets</title>

    <link href="css/_variables.css" rel="stylesheet" />
    <link href="css/home-indicator.css" rel="stylesheet" />
    <link href="css/prime-tools.css" rel="stylesheet" />
    <link href="css/asset-library.css" rel="stylesheet" />
  </head>
  <body class="has-ios-home-indicator">
    <div id="container" class="prime-page">
      <svg class="prime-grain" viewBox="0 0 200 200" preserveAspectRatio="none" aria-hidden="true">
        <filter id="primeNoiseFilter">
          <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <rect width="100%" height="100%" filter="url(#primeNoiseFilter)" />
      </svg>
      <div class="prime-snow" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>
      <main id="assetLibrary" class="asset-library" aria-label="Asset Library">
        <header class="asset-library__header">
          <button id="assetBackButton" class="asset-library__back" type="button" aria-label="Back to folders" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m14.5 5-7 7 7 7" />
            </svg>
          </button>
          <div class="asset-library__heading">
            <h1 id="assetPageTitle">Assets</h1>
            <p id="assetPageDescription">Keep images and videos ready to add.</p>
          </div>
          <span id="assetPageCount" class="asset-library__count" aria-live="polite">0 folders</span>
        </header>

        <section id="assetFolderView" class="asset-library__view" aria-label="Asset folders">
          <div id="assetFolderGrid" class="asset-folder-grid"></div>
          <div id="assetFolderEmpty" class="asset-empty">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3.5 7.5h6l1.8 2h9.2v9.5a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 19V7.5Z" />
              <path d="M3.5 10h17" />
            </svg>
            <strong>No folders yet</strong>
            <span>Create one to start building your library.</span>
          </div>
        </section>

        <section id="assetItemsView" class="asset-library__view" aria-label="Folder assets" hidden>
          <div id="assetItemGrid" class="asset-item-grid"></div>
          <div id="assetItemEmpty" class="asset-empty">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5.5h16v13H4z" />
              <path d="m5.5 16 4.2-4.2 3.1 3.1 2.2-2.2 3.5 3.3" />
              <circle cx="15.8" cy="9.2" r="1.3" />
            </svg>
            <strong>This folder is empty</strong>
            <span>Drag images or videos anywhere into this folder.</span>
          </div>
          <div class="asset-drop-overlay" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 4v11M8 11l4 4 4-4" />
              <path d="M5 19h14" />
            </svg>
            <strong>Drop to add media</strong>
          </div>
        </section>

        <div id="assetStatus" class="asset-status" role="status" aria-live="polite" hidden></div>

        <button id="assetPrimaryAction" class="asset-fab" type="button" aria-label="Create folder" title="Create folder">
          <svg class="asset-fab__plus" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </main>
    </div>

    <div id="iosHomeIndicator" class="ios-home-indicator" data-target-page="index.html">
      <div class="ios-home-indicator__touch-target" role="button" aria-label="Swipe up" tabindex="0">
        <div class="ios-home-indicator__bar"></div>
      </div>
    </div>
    <script type="text/javascript" src="js/prime-theme.js" charset="utf-8" defer></script>
    <script type="text/javascript" src="js/reorder-motion.js" charset="utf-8" defer></script>
    <script type="text/javascript" src="js/default-asset-library.js" charset="utf-8" defer></script>
    <script type="text/javascript" src="js/asset-library.js" charset="utf-8" defer></script>
    <script type="text/javascript" src="js/home-indicator.js" charset="utf-8" defer></script>
  </body>
</html>

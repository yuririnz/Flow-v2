<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Flow Panel Preview</title>
    <link href="../panel/css/_variables.css" rel="stylesheet" />
    <link href="../panel/css/preset.css" rel="stylesheet" />
    <link href="../panel/css/style.css" rel="stylesheet" />
    <link href="../panel/css/fontawesome/css/fontawesome.css" rel="stylesheet" />
    <link href="../panel/css/fontawesome/css/solid.css" rel="stylesheet" />
    <link href="../panel/css/fontawesome/css/regular.css" rel="stylesheet" />
    <style>
      #graphPanel {
        flex-basis: 58%;
      }

      #canvas-wrapper,
      #canvas,
      #canvasLast {
        height: calc(100% - 2px);
        left: 1px;
        top: 1px;
        width: calc(100% - 2px);
      }

      #canvas-wrapper {
        position: absolute;
      }

      #CP1 {
        left: 28%;
        top: 62%;
      }

      #CP2 {
        left: 76%;
        top: 18%;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <div id="graphPanel">
        <div id="graphPanel-top">
          <div id="canvas-wrapper">
            <div id="CP1"></div>
            <div id="CP2"></div>
          </div>
          <canvas id="canvasLast"></canvas>
          <canvas id="canvas"></canvas>
        </div>
        <div id="controls">
          <div class="flex-row" id="bezierValueRow">
            <div class="button" id="btn_readValue"><i class="fa-solid fa-arrow-right-to-bracket"></i></div>
            <div class="button" id="btn_editBezierValues">0.24, 0.62, 0.74, 1.00</div>
            <div class="button" id="btn_saveCurve"><i class="fa-regular fa-star"></i></div>
          </div>
          <div class="flex-row" id="applyRow">
            <div class="flex-row flex-grow" id="easeDirectionControl">
              <input type="radio" id="Out" name="easeDirection" value="2" />
              <label class="button" for="Out"><i class="fa-solid fa-chevron-left"></i></label>
              <input type="radio" id="Both" name="easeDirection" value="0" checked />
              <label class="button" for="Both"><i class="fa-solid fa-bezier-curve"></i></label>
              <input type="radio" id="In" name="easeDirection" value="1" />
              <label class="button" for="In"><i class="fa-solid fa-chevron-right"></i></label>
            </div>
            <div class="button big" id="btn_applyValues">Apply</div>
          </div>
        </div>
      </div>
      <div id="divider"><i class="fa-solid fa-ellipsis-vertical"></i></div>
      <div id="libraryPanel">
        <div id="libraryIO" class="flex-row">
          <select id="ddLibraries" class="button flex-grow">
            <option>Presets</option>
          </select>
          <div id="libraryIOButtons" class="flex-row">
            <div class="button"><i class="fa-solid fa-plus"></i></div>
            <div class="button"><i class="fa-solid fa-file-import"></i></div>
            <div class="button"><i class="fa-solid fa-file-export"></i></div>
            <div class="button"><i class="fa-solid fa-trash-can"></i></div>
          </div>
        </div>
        <div id="library"></div>
      </div>
    </div>
    <script>
      const canvas = document.getElementById('canvas');
      const last = document.getElementById('canvasLast');
      const host = document.getElementById('graphPanel-top');

      function sizeCanvas(target) {
        const rect = host.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        target.width = Math.floor(rect.width * dpr);
        target.height = Math.floor(rect.height * dpr);
        target.style.width = rect.width + 'px';
        target.style.height = rect.height + 'px';
        return { ctx: target.getContext('2d'), width: rect.width, height: rect.height, dpr };
      }

      function draw() {
        const previous = sizeCanvas(last);
        previous.ctx.scale(previous.dpr, previous.dpr);
        previous.ctx.clearRect(0, 0, previous.width, previous.height);
        previous.ctx.strokeStyle = 'rgba(255,255,255,.28)';
        previous.ctx.lineWidth = 1;
        previous.ctx.beginPath();
        previous.ctx.moveTo(16, previous.height - 16);
        previous.ctx.bezierCurveTo(previous.width * .2, previous.height * .56, previous.width * .68, previous.height * .22, previous.width - 16, 20);
        previous.ctx.stroke();

        const current = sizeCanvas(canvas);
        current.ctx.scale(current.dpr, current.dpr);
        current.ctx.clearRect(0, 0, current.width, current.height);
        current.ctx.strokeStyle = '#fff';
        current.ctx.lineWidth = 2;
        current.ctx.lineCap = 'round';
        current.ctx.beginPath();
        current.ctx.moveTo(16, current.height - 16);
        current.ctx.bezierCurveTo(current.width * .25, current.height * .62, current.width * .74, current.height * .22, current.width - 16, 18);
        current.ctx.stroke();
      }

      function preset(name, selected) {
        const item = document.createElement('div');
        item.className = 'preset ' + (selected ? 'selected' : 'deselected');
        item.innerHTML = '<div class="svgContainer"><svg viewBox="0 0 100 100"><path d="M10 86 C 20 46, 54 18, 88 12" stroke-width="3"/><circle cx="10" cy="86" r="3"/><circle cx="88" cy="12" r="3"/></svg></div><span>' + name + '</span>';
        return item;
      }

      ['Fast', 'A Little Fast', 'Zoom', 'Zoom 2', 'Turbulent', 'Test 2', 'Shake 3D', 'Zoom In Out'].forEach((name, index) => {
        document.getElementById('library').appendChild(preset(name, index === 0));
      });

      draw();
      window.addEventListener('resize', draw);
    </script>
  </body>
</html>
